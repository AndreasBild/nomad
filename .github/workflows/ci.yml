name: Nomad CI & Validation

on:
  push:
    branches: [ master, "feature/**", "fix/**", "chore/**" ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Validate HTML, SEO & Static Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Nomad Validation Suite
        run: |
          chmod +x test.sh scripts/validate.py
          ./test.sh
