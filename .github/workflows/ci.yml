name: Nomad CI & Validation

on:
  push:
    branches: [ master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Validate HTML, SEO & Static Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate XML (Sitemap) and Robots.txt
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          # Validate sitemap.xml
          tree = ET.parse('sitemap.xml')
          root = tree.getroot()
          print(f'✓ sitemap.xml is valid XML with {len(root)} URL entries.')
          
          # Validate sitemap.xsl
          ET.parse('sitemap.xsl')
          print('✓ sitemap.xsl is valid XML/XSL.')
          
          # Validate robots.txt
          with open('robots.txt') as f:
              content = f.read()
              assert 'Sitemap:' in content, 'robots.txt must contain a Sitemap reference'
              assert 'User-agent:' in content, 'robots.txt must contain User-agent'
          print('✓ robots.txt format is valid.')
          "

      - name: Validate JSON-LD Structured Data in HTML
        run: |
          python3 -c "
          import json, re, glob
          html_files = glob.glob('*.html')
          for fpath in html_files:
              with open(fpath, encoding='utf-8') as f:
                  content = f.read()
              matches = re.findall(r'<script type=\"application/ld\+json\">(.*?)</script>', content, re.DOTALL)
              for i, match in enumerate(matches):
                  try:
                      data = json.loads(match.strip())
                      print(f'✓ {fpath} JSON-LD block {i+1} is valid schema ({data.get(\"@type\") or \"@graph\"}).')
                  except Exception as e:
                      raise AssertionError(f'Invalid JSON-LD in {fpath}: {e}')
          "

      - name: Run Dev Server and Test Endpoints (HTTP 200)
        run: |
          python3 -m http.server 8000 &
          SERVER_PID=$!
          sleep 2
          
          python3 -c "
          import urllib.request
          urls = [
              'http://localhost:8000/',
              'http://localhost:8000/index.html',
              'http://localhost:8000/impressum.html',
              'http://localhost:8000/datenschutz.html',
              'http://localhost:8000/robots.txt',
              'http://localhost:8000/sitemap.xml',
              'http://localhost:8000/sitemap.xsl',
              'http://localhost:8000/css/bootstrap.min.css',
              'http://localhost:8000/css/aos.css',
              'http://localhost:8000/css/templatemo-nomad-force.css',
              'http://localhost:8000/css/katrin.css',
              'http://localhost:8000/js/bootstrap.bundle.min.js',
              'http://localhost:8000/js/aos.js',
              'http://localhost:8000/js/custom.js',
              'http://localhost:8000/sw.js',
              'http://localhost:8000/images/Katrin-Neumann-Moderatorin.webp',
              'http://localhost:8000/images/Katrin-Neumann-Moderatorin-768.webp',
              'http://localhost:8000/images/Instagram_logo.png',
              'http://localhost:8000/llms.txt',
              'http://localhost:8000/llms-full.txt'
          ]
          for u in urls:
              resp = urllib.request.urlopen(u)
              assert resp.status == 200, f'Failed URL: {u}'
              print(f'✓ [HTTP 200] {u}')
          print('All endpoints verified successfully!')
          "
          
          kill $SERVER_PID
